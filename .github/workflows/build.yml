name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: macOS and iOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build for macOS
        run: swift build
      - name: Build for iOS Simulator
        run: >-
          xcodebuild -scheme SKComponentKit
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build/xcode
          CODE_SIGNING_ALLOWED=NO build
      - name: Build UIKit example
        run: >-
          xcodebuild -project Examples/UIKit/SKComponentKitExample.xcodeproj
          -scheme SKComponentKitExample
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build/example
          CODE_SIGNING_ALLOWED=NO build
      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          devices = json.loads((Path(os.environ["RUNNER_TEMP"]) / "devices.json").read_text())
          phones = [device for runtime in devices["devices"].values() for device in runtime
                    if device["name"].startswith("iPhone") and device.get("isAvailable")]
          if not phones:
              raise SystemExit("No available iPhone simulator")
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write("TEST_SIMULATOR_ID=" + phones[0]["udid"] + "\n")
          PY
      - name: Test UIKit components and example
        run: >-
          xcodebuild -quiet
          -project Examples/UIKit/SKComponentKitExample.xcodeproj
          -scheme SKComponentKitExample
          -destination "platform=iOS Simulator,id=$TEST_SIMULATOR_ID"
          -derivedDataPath .build/example
          -parallel-testing-enabled NO test
