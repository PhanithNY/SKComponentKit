name: SKComponentKitExample
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: "15.0"
packages:
  EasyAnchor:
    url: https://github.com/PhanithNY/EasyAnchor.git
    revision: fbc2a3b5790a1a857563c0fb7d54ff3bb36cdacc
  SKComponentKit:
    path: ../..
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    VERSIONING_SYSTEM: apple-generic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  SKComponentKitExample:
    type: application
    platform: iOS
    sources:
      - App
      - Catalog
      - Demos
    dependencies:
      - package: SKComponentKit
      - package: EasyAnchor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phanithny.SKComponentKit.Example
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SK Components
        NSCameraUsageDescription: Scan QR codes and barcodes in the component example.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  SKComponentKitExampleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: SKComponentKitExample
      - package: SKComponentKit
      - package: EasyAnchor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phanithny.SKComponentKit.Example.Tests
        GENERATE_INFOPLIST_FILE: YES
  SKComponentKitExampleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: SKComponentKitExample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phanithny.SKComponentKit.Example.UITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SKComponentKitExample:
    build:
      targets:
        SKComponentKitExample: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SKComponentKitExampleTests
        - SKComponentKitExampleUITests
